<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sem conexão | PastorIA</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a1f44; color: #fff; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
    img { width: 72px; height: 72px; }
    h1 { font-family: Georgia, serif; font-size: 26px; margin: 16px 0 8px; }
    p { color: rgba(255,255,255,.75); max-width: 340px; line-height: 1.5; }
    button { margin-top: 16px; background: #c9a227; color: #0a1f44; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="PastorIA" />
    <h1>Sem conexão</h1>
    <p>O PastorIA precisa de internet para mostrar os dados da igreja. Assim que a conexão voltar, é só tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
